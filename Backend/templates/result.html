{% extends "layout.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Detection Result</h2>

    <div class="row">
        <div class="col-md-6">
            <h5>Original Image</h5>
            <img src="{{ url_for('static', filename='uploads/' + original_image) }}"
                 class="img-fluid" alt="Original upload">
        </div>
        <div class="col-md-6">
            <h5>Annotated Image</h5>
            <img src="{{ url_for('static', filename='uploads/' + annotated_image) }}"
                 class="img-fluid" alt="Detected issues">
        </div>
    </div>

    <a href="{{ url_for('upload_page') }}" class="btn btn-primary mt-3">Upload Another</a>
</div>
{% endblock %}
