<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CivicLens</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="logo">CivicLens</a>

        <div class="nav-links">
            {% if session.is_admin %}
                <a href="{{ url_for('admin_reports') }}" class="nav-link nav-link--admin">Admin panel</a>
            {% endif %}

            {% if session.user_id %}
                <span class="nav-greeting">Hi, <strong>{{ session.username }}</strong></span>
                <a href="{{ url_for('logout') }}" class="nav-link">Logout</a>
            {% else %}
                <a href="{{ url_for('login') }}" class="nav-link">Login</a>
                <a href="{{ url_for('register') }}" class="nav-link nav-link--primary">Register</a>
            {% endif %}
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
