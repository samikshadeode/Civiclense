{% extends "layout.html" %}

{% block content %}
<h2>Community Reports</h2>

<div class="report-list-vertical">
  {% for report in reports %}
  <div class="report-card">
    {% if report.image_url %}
      <img src="{{ url_for('static', filename='uploads/'+ report.image_url) }}" alt="{{ report.category }}">
    {% endif %}
    <div class="report-info">
      <p><strong>Report #{{ report.report_id }}</strong> — {{ report.category }}</p>
      <p>Status: {{ report.status }}</p>

      <form method="POST" action="/upvote" class="upvote-form">
        <input type="hidden" name="report_id" value="{{ report.report_id }}">
        <button type="submit" class="status-update-btn">👍 Upvote ({{ report.upvotes }})</button>
      </form>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
