{% extends "layout.html" %}

{% block content %}
    <h2>Community Reports</h2>

    {% for report in reports %}
    <div class="report-card" style="border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 8px;">
        <p><strong>Report #{{ report.report_id }}</strong> — {{ report.category }}</p>
        <p>Status: {{ report.status }}</p>

        {% if report.image_path %}
            <img src="{{ url_for('static', filename=report.image_path) }}" width="250">
        {% endif %}

        <form method="POST" action="/upvote" style="display:inline;">
            <input type="hidden" name="report_id" value="{{ report.report_id }}">
            <button type="submit">👍 Upvote ({{ report.upvotes }})</button>
        </form>
    </div>
    {% endfor %}
{% endblock %}
